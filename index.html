<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#ffeaf2">
<meta name="description"
      content="A tiny little digital world made for Yazhini 💗">

<title>Yazhini.exe 💗</title>

<style>

/* =========================================================
   YAZHINI.EXE — THE BESTEST FRIENDSHIP GAME
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Patrick+Hand&display=swap');


/* =========================================================
   VARIABLES
   ========================================================= */

:root {

    --pink: #f7a9c7;
    --pink-dark: #e875a5;
    --pink-light: #ffe5ef;

    --lavender: #cfc2f1;
    --lavender-light: #eee9ff;

    --cream: #fffaf3;
    --peach: #ffd9c7;

    --rose: #bd668b;

    --brown: #574452;
    --muted: #927f8d;

    --white: #ffffff;

    --yellow: #ffd84d;
    --yellow-dark: #e4ad00;
    --yellow-light: #fff6bd;

    --shadow:
        0 20px 50px rgba(106, 70, 92, 0.12);

    --soft-shadow:
        0 10px 30px rgba(106, 70, 92, 0.10);

}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {

    min-height: 100vh;

    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 10% 20%,
            #ffe7f1 0,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            #eee8ff 0,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #fffaf7,
            #fff1f6
        );

    color: var(--brown);

    font-family:
        "Baloo 2",
        system-ui,
        sans-serif;

    transition:
        background 1s ease,
        color .7s ease;
}


/* =========================================================
   YELLOW MODE
   ========================================================= */

body.yellow-mode {

    background:
        radial-gradient(
            circle at 10% 15%,
            #fff5a8 0,
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 85%,
            #ffe37a 0,
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #fffdf0,
            #fff4a8
        );

}

body.yellow-mode .game-card {

    border-color: #f2d875;

}

body.yellow-mode .progress-bar {

    background:
        linear-gradient(
            90deg,
            #ffe16a,
            #e9b800
        );

}

body.yellow-mode .pill {

    color: #9b7900;
    border-color: #f0d77a;

}


/* =========================================================
   APP
   ========================================================= */

#app {

    min-height: 100vh;

    position: relative;

}


/* =========================================================
   SCREEN
   ========================================================= */

.screen {

    min-height: 100vh;

    padding:
        25px 18px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    overflow: hidden;

}

.screen.hidden {
    display: none;
}


/* =========================================================
   CONTAINER
   ========================================================= */

.container {

    width:
        min(100%, 760px);

    position: relative;

    z-index: 2;

}


/* =========================================================
   BACKGROUND DECORATIONS
   ========================================================= */

.bg-decoration {

    position: fixed;

    pointer-events: none;

    user-select: none;

    z-index: 0;

    opacity: .65;

}

.decor-1 {

    top: 8%;
    left: 7%;

    animation:
        floatAround 5s ease-in-out infinite;

}

.decor-2 {

    top: 17%;
    right: 8%;

    animation:
        floatAround 6s ease-in-out infinite reverse;

}

.decor-3 {

    bottom: 12%;
    left: 12%;

    animation:
        floatAround 7s ease-in-out infinite;

}

.decor-4 {

    bottom: 18%;
    right: 10%;

    animation:
        floatAround 5.5s ease-in-out infinite reverse;

}

@keyframes floatAround {

    0%, 100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-18px)
            rotate(8deg);
    }

}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

h1,
h2,
h3,
.script {

    font-family:
        "Patrick Hand",
        cursive;

}

h1 {

    font-size:
        clamp(
            3.1rem,
            13vw,
            6rem
        );

    line-height: .9;

    font-weight: 400;

}

h2 {

    font-size:
        clamp(
            2.25rem,
            9vw,
            4rem
        );

    line-height: 1;

    font-weight: 400;

}

h3 {

    font-size:
        1.7rem;

}

p {

    font-size:
        1.08rem;

    line-height:
        1.65;

}

.small {

    font-size:
        .85rem;

    color:
        var(--muted);

}

.center {

    text-align:
        center;

}


/* =========================================================
   GAME CARD
   ========================================================= */

.game-card {

    background:
        rgba(
            255,
            255,
            255,
            .84
        );

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    border:
        1px solid
        rgba(
            235,
            210,
            225,
            .9
        );

    border-radius:
        38px;

    padding:
        clamp(
            28px,
            6vw,
            55px
        );

    box-shadow:
        var(--shadow);

    position:
        relative;

    overflow:
        hidden;

}

.game-card::before {

    content: "";

    position:
        absolute;

    width:
        250px;

    height:
        250px;

    background:
        rgba(
            255,
            220,
            236,
            .25
        );

    border-radius:
        50%;

    top:
        -130px;

    right:
        -100px;

    pointer-events:
        none;

}


/* =========================================================
   BUTTONS
   ========================================================= */

button {

    font-family:
        inherit;

}

.btn {

    border:
        none;

    min-height:
        50px;

    padding:
        13px 23px;

    border-radius:
        999px;

    font-size:
        1rem;

    font-weight:
        800;

    cursor:
        pointer;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            var(--pink-dark),
            var(--pink)
        );

    box-shadow:
        0 10px 22px
        rgba(
            232,
            117,
            165,
            .25
        );

    transition:
        transform .2s ease,
        box-shadow .2s ease;

    position:
        relative;

    z-index:
        3;

}

.btn:hover {

    transform:
        translateY(-3px)
        scale(1.02);

}

.btn:active {

    transform:
        scale(.96);

}

.btn.secondary {

    color:
        var(--brown);

    background:
        white;

    border:
        1px solid #eadbe4;

    box-shadow:
        none;

}

.btn.lavender {

    color:
        #594d6c;

    background:
        linear-gradient(
            135deg,
            #d9d0f5,
            #c6b9ed
        );

}

.btn.yellow {

    color:
        #705900;

    background:
        linear-gradient(
            135deg,
            #ffe36c,
            #f5c62c
        );

}

.btn.big {

    padding:
        16px 30px;

    font-size:
        1.05rem;

}


/* =========================================================
   PILL
   ========================================================= */

.pill {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        6px;

    padding:
        8px 14px;

    border-radius:
        999px;

    background:
        #fff;

    border:
        1px solid
        #efdde7;

    font-size:
        .78rem;

    font-weight:
        800;

    letter-spacing:
        .04em;

    color:
        var(--rose);

}


/* =========================================================
   PROGRESS
   ========================================================= */

.progress-wrap {

    margin-bottom:
        20px;

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

}

.progress-label {

    font-size:
        .72rem;

    font-weight:
        800;

    color:
        var(--muted);

    white-space:
        nowrap;

}

.progress {

    flex:
        1;

    height:
        8px;

    background:
        #f1e6ed;

    border-radius:
        99px;

    overflow:
        hidden;

}

.progress-bar {

    height:
        100%;

    width:
        0%;

    border-radius:
        99px;

    background:
        linear-gradient(
            90deg,
            var(--pink),
            var(--pink-dark)
        );

    transition:
        width .5s ease;

}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions {

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    gap:
        11px;

    flex-wrap:
        wrap;

    margin-top:
        28px;

}


/* =========================================================
   OPENING
   ========================================================= */

.opening-character {

    font-size:
        4.5rem;

    margin:
        25px auto 10px;

    animation:
        peek 2.2s
        ease-in-out
        infinite;

}

@keyframes peek {

    0%, 100% {

        transform:
            translateY(8px);

    }

    50% {

        transform:
            translateY(-5px);

    }

}


/* =========================================================
   PRESIDENT / VP
   ========================================================= */

.badges {

    display:
        flex;

    justify-content:
        center;

    gap:
        15px;

    flex-wrap:
        wrap;

    margin:
        28px 0;

}

.badge {

    width:
        145px;

    padding:
        23px 15px;

    background:
        white;

    border:
        1px solid #efdde7;

    border-radius:
        26px;

    box-shadow:
        var(--soft-shadow);

    cursor:
        pointer;

    transition:
        transform .2s ease;

}

.badge:hover {

    transform:
        rotate(-3deg)
        translateY(-5px);

}

.badge-icon {

    font-size:
        3rem;

}

.badge-name {

    display:
        block;

    margin-top:
        8px;

    font-weight:
        800;

}


/* =========================================================
   CHAT BUBBLES
   ========================================================= */

.chat {

    display:
        flex;

    flex-direction:
        column;

    gap:
        14px;

    margin:
        28px auto;

    max-width:
        560px;

}

.chat-row {

    display:
        flex;

    width:
        100%;

}

.chat-row.me {

    justify-content:
        flex-end;

}

.chat-row.her {

    justify-content:
        flex-start;

}

.chat-bubble {

    max-width:
        82%;

    padding:
        13px 17px;

    border-radius:
        22px;

    font-size:
        1rem;

    line-height:
        1.45;

    box-shadow:
        0 7px 20px
        rgba(
            100,
            70,
            90,
            .07
        );

}

.chat-row.me
.chat-bubble {

    background:
        #f8bdd3;

    border-bottom-right-radius:
        7px;

}

.chat-row.her
.chat-bubble {

    background:
        white;

    border:
        1px solid
        #efdae5;

    border-bottom-left-radius:
        7px;

}

.chat-name {

    display:
        block;

    font-size:
        .7rem;

    font-weight:
        800;

    margin-bottom:
        3px;

    color:
        var(--muted);

}


/* =========================================================
   CHAT TYPING
   ========================================================= */

.typing-dots {

    display:
        inline-flex;

    gap:
        4px;

}

.typing-dots span {

    width:
        6px;

    height:
        6px;

    background:
        var(--pink-dark);

    border-radius:
        50%;

    animation:
        dot .9s
        infinite;

}

.typing-dots span:nth-child(2) {

    animation-delay:
        .15s;

}

.typing-dots span:nth-child(3) {

    animation-delay:
        .3s;

}

@keyframes dot {

    0%, 100% {
        opacity: .3;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-4px);
    }

}


/* =========================================================
   MEMORY LANE
   ========================================================= */

.memory-list {

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;

    margin:
        28px 0;

}

.memory-item {

    display:
        flex;

    align-items:
        center;

    gap:
        14px;

    padding:
        15px 16px;

    border:
        1px solid
        #eadce5;

    background:
        rgba(
            255,
            255,
            255,
            .92
        );

    border-radius:
        20px;

    text-align:
        left;

    cursor:
        pointer;

    transition:
        transform .2s ease,
        background .2s ease;

}

.memory-item:hover {

    transform:
        translateX(4px);

}

.memory-item.checked {

    background:
        #fff0f6;

    border-color:
        #efb8cf;

}

.memory-checkbox {

    min-width:
        30px;

    height:
        30px;

    border-radius:
        10px;

    border:
        2px solid
        #ddb9ca;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    font-weight:
        900;

    color:
        var(--rose);

    background:
        white;

}

.memory-item.checked
.memory-checkbox {

    background:
        #f7a9c7;

    border-color:
        #f7a9c7;

    color:
        white;

}

.memory-icon {

    font-size:
        1.7rem;

}

.memory-text {

    font-weight:
        700;

    flex:
        1;

}

.memory-note {

    font-size:
        .78rem;

    color:
        var(--muted);

}


/* =========================================================
   VIBRANCE
   ========================================================= */

.vibrance {

    position:
        relative;

    padding:
        30px 20px;

    margin:
        25px 0;

    border-radius:
        30px;

    background:
        linear-gradient(
            135deg,
            #fff0f7,
            #eee8ff
        );

    border:
        1px solid
        #ead9e7;

}

.vibrance-year {

    font-family:
        "Patrick Hand",
        cursive;

    font-size:
        4rem;

    color:
        var(--rose);

    line-height:
        .9;

}

.vibrance-title {

    font-size:
        1.8rem;

    font-weight:
        800;

    margin-top:
        8px;

}


/* =========================================================
   SONG / YELLOW
   ========================================================= */

.song-screen {

    transition:
        background 1s ease;

}

.song-card {

    padding:
        24px;

    border-radius:
        28px;

    background:
        rgba(
            255,
            255,
            255,
            .75
        );

    border:
        1px solid
        rgba(
            229,
            195,
            69,
            .45
        );

}

.song-note {

    font-size:
        4.5rem;

    animation:
        musicFloat 2s
        ease-in-out
        infinite;

}

@keyframes musicFloat {

    0%,100% {
        transform:
            translateY(0)
            rotate(-5deg);
    }

    50% {
        transform:
            translateY(-9px)
            rotate(5deg);
    }

}

.song-title {

    font-size:
        clamp(
            3rem,
            13vw,
            5rem
        );

    color:
        #b99000;

}

.song-artist {

    font-size:
        1.2rem;

    color:
        #866d00;

}


/* =========================================================
   STATS
   ========================================================= */

.stats {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        11px;

    margin:
        27px 0;

    text-align:
        left;

}

.stat {

    background:
        rgba(
            255,
            255,
            255,
            .88
        );

    border:
        1px solid
        #efdee7;

    border-radius:
        20px;

    padding:
        15px;

    transition:
        transform .2s ease;

}

.stat:hover {

    transform:
        translateY(-3px);

}

.stat-label {

    display:
        block;

    font-size:
        .82rem;

    color:
        var(--muted);

}

.stat-value {

    display:
        block;

    margin-top:
        2px;

    font-size:
        1.25rem;

    font-weight:
        800;

}


/* =========================================================
   MOMENTS / MEMORY CARDS
   ========================================================= */

.polaroids {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        18px;

    margin:
        28px 0;

}

.polaroid {

    min-height:
        145px;

    background:
        #fff;

    border-radius:
        8px;

    padding:
        17px 14px 21px;

    box-shadow:
        0 10px 22px
        rgba(
            82,
            55,
            70,
            .1
        );

    cursor:
        pointer;

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;

}

.polaroid:nth-child(1) {

    transform:
        rotate(-2deg);

}

.polaroid:nth-child(2) {

    transform:
        rotate(2deg);

}

.polaroid:nth-child(3) {

    transform:
        rotate(1deg);

}

.polaroid:nth-child(4) {

    transform:
        rotate(-3deg);

}

.polaroid:hover {

    transform:
        rotate(0)
        scale(1.04);

}

.polaroid-icon {

    font-size:
        2.5rem;

    margin-bottom:
        8px;

}

.polaroid-text {

    font-weight:
        700;

}


/* =========================================================
   PROUD SLIDE
   ========================================================= */

.proud-card {

    position:
        relative;

}

.proud-list {

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;

    margin:
        27px 0;

}

.proud-item {

    text-align:
        left;

    padding:
        15px 17px;

    background:
        white;

    border:
        1px solid
        #eadce5;

    border-radius:
        20px;

    box-shadow:
        0 7px 18px
        rgba(
            80,
            50,
            70,
            .05
        );

}

.proud-icon {

    margin-right:
        8px;

}

.proud-highlight {

    font-family:
        "Patrick Hand",
        cursive;

    font-size:
        1.6rem;

    color:
        var(--rose);

}


/* =========================================================
   SERIOUS
   ========================================================= */

.serious {

    max-width:
        570px;

    margin:
        25px auto;

}

.serious-line {

    opacity:
        0;

    transform:
        translateY(15px);

    animation:
        seriousReveal
        .8s forwards;

    margin:
        18px 0;

}

.serious-line:nth-child(1) {
    animation-delay: .3s;
}

.serious-line:nth-child(2) {
    animation-delay: 1.1s;
}

.serious-line:nth-child(3) {
    animation-delay: 1.9s;
}

.serious-line:nth-child(4) {
    animation-delay: 2.7s;
}

.serious-line:nth-child(5) {
    animation-delay: 3.5s;
}

.serious-line:nth-child(6) {
    animation-delay: 4.3s;
}

@keyframes seriousReveal {

    to {

        opacity:
            1;

        transform:
            translateY(0);

    }

}

.serious-highlight {

    font-family:
        "Patrick Hand",
        cursive;

    font-size:
        clamp(
            2rem,
            7vw,
            3rem
        );

    color:
        var(--rose);

}


/* =========================================================
   HEART GAME
   ========================================================= */

.heart-grid {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        13px;

    margin:
        27px 0;

}

.heart-btn {

    min-height:
        75px;

    border:
        1px solid
        #efdde7;

    border-radius:
        22px;

    background:
        white;

    color:
        var(--pink-dark);

    font-size:
        2rem;

    cursor:
        pointer;

    transition:
        transform .2s ease,
        background .2s ease;

}

.heart-btn:hover {

    transform:
        translateY(-4px)
        rotate(-4deg);

}

.heart-btn.found {

    background:
        #fff0f6;

    animation:
        heartPop .4s ease;

}

@keyframes heartPop {

    50% {

        transform:
            scale(1.2);

    }

}

.reason-display {

    min-height:
        75px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-family:
        "Patrick Hand",
        cursive;

    font-size:
        1.5rem;

    color:
        var(--rose);

}


/* =========================================================
   NO BUTTON GAME
   ========================================================= */

.no-game {

    margin-top:
        30px;

}

.no-zone {

    position:
        relative;

    height:
        210px;

    margin-top:
        10px;

}

.no-button {

    position:
        absolute;

    left:
        50%;

    top:
        70%;

    transform:
        translate(
            -50%,
            -50%
        );

    transition:
        left .22s ease,
        top .22s ease,
        transform .22s ease;

}


/* =========================================================
   CONTRACT
   ========================================================= */

.contract {

    margin-top:
        25px;

    padding:
        25px;

    background:
        linear-gradient(
            rgba(
                255,
                255,
                255,
                .92
            ),
            rgba(
                255,
                255,
                255,
                .92
            )
        ),
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 28px,
            #eedee5 29px
        );

    border:
        2px dashed
        #d9b7c8;

    border-radius:
        22px;

    text-align:
        left;

}

.contract-title {

    text-align:
        center;

    font-family:
        "Patrick Hand",
        cursive;

    font-size:
        1.8rem;

/* =========================================================
   SOUND
   ========================================================= */

function playTone(
    frequency = 500,
    duration = .08,
    type = "sine"
) {

    if (!soundEnabled)
        return;

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .06,
            audioContext.currentTime + .01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    } catch (error) {

        /* optional */

    }

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(message) {

    const oldToast =
        document.querySelector(
            ".toast"
        );

    if (oldToast)
        oldToast.remove();

    const toast =
        document.createElement(
            "div"
        );

    toast.className =
        "toast";

    toast.textContent =
        message;

    document.body.appendChild(
        toast
    );

    setTimeout(() => {

        toast.remove();

    }, 2300);

}


/* =========================================================
   CONFETTI
   ========================================================= */

function createConfetti(
    amount = 45
) {

    const pieces = [
        "💗",
        "🌸",
        "⭐",
        "🎉",
        "🌷",
        "♡",
        "✦"
    ];

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );

        piece.className =
            "confetti";

        piece.textContent =
            pieces[
                Math.floor(
                    Math.random() *
                    pieces.length
                )
            ];

        piece.style.left =
            `${Math.random() * 100}%`;

        piece.style.top =
            `${30 + Math.random() * 15}%`;

        piece.style.setProperty(
            "--x",
            Math.random() * 100
        );

        piece.style.animationDelay =
            `${Math.random() * .3}s`;

        document.body.appendChild(
            piece
        );

        setTimeout(
            () => piece.remove(),
            1900
        );

    }

    playTone(700, .08);

    setTimeout(
        () => playTone(900, .08),
        100
    );

}


/* =========================================================
   PETALS
   ========================================================= */

function createPetals(
    amount = 14
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const petal =
            document.createElement(
                "div"
            );

        petal.className =
            "petal";

        petal.textContent =
            [
                "🌸",
                "🌷",
                "♡"
            ][i % 3];

        petal.style.left =
            `${Math.random() * 100}%`;

        petal.style.top =
            `${-10 - Math.random() * 10}px`;

        petal.style.setProperty(
            "--drift",
            Math.random() * 100
        );

        petal.style.animationDelay =
            `${Math.random() * .7}s`;

        document.body.appendChild(
            petal
        );

        setTimeout(
            () => petal.remove(),
            3500
        );

    }

}


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress() {

    if (
        currentLevel === 0
    ) {

        progressWrap.style.display =
            "none";

        return;

    }

    progressWrap.style.display =
        "flex";

    const percent =
        Math.min(
            100,
            (
                (
                    currentLevel - 1
                ) /
                (
                    TOTAL_LEVELS - 1
                )
            ) * 100
        );

    progressBar.style.width =
        `${percent}%`;

    progressLabel.textContent =
        currentLevel === TOTAL_LEVELS
            ? "FINAL"
            : `LEVEL ${currentLevel}`;

}


/* =========================================================
   RENDER
   ========================================================= */

function render(content) {

    gameCard.classList.remove(
        "animate-in"
    );

    void gameCard.offsetWidth;

    gameCard.innerHTML =
        content;

    gameCard.classList.add(
        "animate-in"
    );

    updateProgress();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    bindButtons();

}

   ========================================================= */

function nextLevel() {

    if (
        currentLevel <
        TOTAL_LEVELS

        playTone(650, .06);

        renderLevel(

        );

    }

}

/* =========================================================

   ========================================================= */

function bindButtons() {


/* ---------------------------------------------------------
   NEXT
   --------------------------------------------------------- */

document
    .querySelectorAll(
        '[data-action="next"]'
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                playTone(
                    620,
                    .06
                );

                nextLevel();

            }
        );

    });


/* ---------------------------------------------------------
   OPEN
   --------------------------------------------------------- */

const openButton =
    document.querySelector(
        '[data-action="open"]'
    );

if (openButton) {

    openButton.addEventListener(
        "click",
        () => {

            createConfetti(30);

            setTimeout(
                nextLevel,
                400
            );

        }
    );

}


/* ---------------------------------------------------------
   SECRET OBJECTS
   --------------------------------------------------------- */

document
    .querySelectorAll(
        "[data-secret]"
    )
    .forEach(object => {

        object.addEventListener(
            "click",
            () => {

                const message =
                    object.dataset.secret
                        .replace(
                            /\s+/g,
                            " "
                        )
                        .trim();

                secretsFound++;

                showToast(
                    message
                );

                playTone(
                    800,
                    .07
                );

            }
        );

    });


/* ---------------------------------------------------------
   MEMORY LANE
   --------------------------------------------------------- */

document
    .querySelectorAll(
        "[data-memory]"
    )
    .forEach(memory => {

        memory.addEventListener(
            "click",
            () => {

                if (
                    memory.classList.contains(
                        "checked"
                    )
                )
                    return;

                memory.classList.add(
                    "checked"
                );

                const checkbox =
                    memory.querySelector(
                        ".memory-checkbox"
                    );

                checkbox.textContent =
                    "✓";

                memoriesFound++;

                const progress =
                    document.getElementById(
                        "memoryProgress"
                    );

                if (progress) {

                    progress.innerHTML =
                        `Memories unlocked:
                         <b>${memoriesFound} / 5</b>`;

                }

                const messages = [
                    "Unlocked. 🥺",
                    "Ohhh this one. 💗",
                    "Core memory detected.",
                    "Adding this to the memory bank. 📸",
                    "Yep. This belongs here. 🌷"
                ];

                showToast(
                    messages[
                        memoriesFound - 1
                    ]
                );

                playTone(
                    620,
                    .07
                );

                if (
                    memoriesFound === 5
                ) {

                    const complete =
                        document.getElementById(
                            "memoryComplete"
                        );

                    if (complete) {

                        complete.style.display =
                            "block";

                    }

                    createPetals(10);

                }

            }
        );

    });


/* ---------------------------------------------------------
   HEARTS
   --------------------------------------------------------- */

document
    .querySelectorAll(
        "[data-reason]"
    )
    .forEach(heart => {

        heart.addEventListener(
            "click",
            () => {

                if (
                    heart.classList.contains(
                        "found"
                    )
                )
                    return;

                heart.classList.add(
                    "found"
                );

                heart.textContent =
                    "💗";

                heart.disabled =
                    true;

                heartsFound++;

                const display =
                    document.getElementById(
                        "reasonDisplay"
                    );

                display.textContent =
                    heart.dataset.reason
                        .replace(
                            /\s+/g,
                            " "
                        )
                        .trim();

                playTone(
                    650,
                    .08
                );

                if (
                    heartsFound >= 6
                ) {

                    const finalHeart =
                        document.getElementById(
                            "finalHeart"
                        );

                    if (finalHeart) {

                        finalHeart.style.display =
                            "block";

                    }

                    createPetals(8);

                }

            }
        );

    });


/* ---------------------------------------------------------
   YES
   --------------------------------------------------------- */

const yesButton =
    document.querySelector(
        '[data-action="yes"]'
    );

if (yesButton) {

    yesButton.addEventListener(
        "click",
        () => {

            createConfetti(55);

            showToast(
                "GOOD. THAT'S ALL I WANTED. 💗"
            );

            playTone(
                750,
                .1
            );

            setTimeout(
                nextLevel,
                1100
            );

        }
    );

}


/* ---------------------------------------------------------
   NO BUTTON
   --------------------------------------------------------- */

const noButton =
    document.getElementById(
        "noButton"
    );

const noZone =
    document.getElementById(
        "noZone"
    );

const noMessage =
    document.getElementById(
        "noMessage"
    );

if (
    noButton &&
    noZone
) {

    const messages = [

        "Nice try. 😭",

        "Absolutely not.",

        "Incorrect answer.",

        "The system disagrees.",

        "Girl, please.",

        "You really thought I'd let you leave? 😭",

        "Try again.",

        "NOPE. 💀"

    ];


    function moveNoButton() {

        const zoneWidth =
            noZone.clientWidth;

        const zoneHeight =
            noZone.clientHeight;

        const buttonWidth =
            noButton.offsetWidth;

        const buttonHeight =
            noButton.offsetHeight;

        const maxX =
            Math.max(
                0,
                zoneWidth -
                buttonWidth
            );

        const maxY =
            Math.max(
                0,
                zoneHeight -
                buttonHeight
            );

        const x =
            Math.random() *
            maxX;

        const y =
            Math.random() *
            maxY;

        noButton.style.left =
            `${x}px`;

        noButton.style.top =
            `${y}px`;

        noButton.style.transform =
            "none";

        if (noMessage) {

            noMessage.textContent =
                messages[
                    Math.floor(
                        Math.random() *
                        messages.length
                    )
                ];

        }

        playTone(
            350,
            .06
        );

    }


    noButton.addEventListener(
        "mouseenter",
        moveNoButton
    );


    noButton.addEventListener(
        "touchstart",
        event => {

            event.preventDefault();

            moveNoButton();

        },
        {
            passive:false
        }
    );


    noButton.addEventListener(
        "click",
        event => {

            event.preventDefault();

            moveNoButton();

        }
    );

}


/* ---------------------------------------------------------
   HUG / FLOWER
   --------------------------------------------------------- */

const flowerButton =
    document.getElementById(
        "flowerButton"
    );

if (flowerButton) {

    flowerButton.addEventListener(
        "click",
        () => {

            createPetals(20);

            showToast(
                "🌷 A flower for my Thangame."
            );

            playTone(
                720,
                .09
            );

        }
    );

}


/* ---------------------------------------------------------
   FINAL
   --------------------------------------------------------- */

const finalButton =
    document.querySelector(
        '[data-action="final"]'
    );

if (finalButton) {

    finalButton.addEventListener(
        "click",
        () => {

            currentLevel =
                15;

            createPetals(20);

            renderLevel(
                15
            );

        }
    );

}


/* ---------------------------------------------------------
   SECRET FINAL
   --------------------------------------------------------- */

const secretButton =
    document.getElementById(
        "secretButton"
    );

if (secretButton) {

    secretButton.addEventListener(
        "click",
        () => {

            const message =
                document.getElementById(
                    "secretMessage"
                );

            if (!message)
                return;

            message.style.display =
                "block";

            secretButton.remove();

            createPetals(12);

            playTone(
                550,
                .12
            );

        }
    );

}

}


/* =========================================================
   SOUND TOGGLE
   ========================================================= */

soundToggle.addEventListener(
    "click",
    () => {

        soundEnabled =
            !soundEnabled;

        soundToggle.textContent =
            soundEnabled
                ? "🎵 soundtrack: ON"
                : "🎵 soundtrack: OFF";

        if (soundEnabled) {

            playTone(
                520,
                .08
            );

            showToast(
                "Tiny soundtrack activated 🎵"
            );

        }

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

renderLevel(0);


})();

</script>

</body>
</html>
